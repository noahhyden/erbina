id: rclone
kind: cli-tool
title: "rclone — rsync for cloud storage"
description: >
  rclone is a command-line program to manage files on cloud storage,
  supporting dozens of providers with sync, mount, and encryption
  features. https://github.com/rclone/rclone

detect:
  command: "rclone --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install rclone"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Rclone.Rclone --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "rclone --version"

version:
  current: "rclone --version"
  latest: { github: rclone/rclone }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade rclone"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Rclone.Rclone --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: cloud

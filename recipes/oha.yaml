id: oha
kind: cli-tool
title: "oha — HTTP load generator with a realtime TUI"
description: >
  oha is an HTTP load generator inspired by rakyll/hey, with a real-time
  terminal UI showing latency histograms, throughput and status-code
  breakdowns. https://github.com/hatoo/oha

detect:
  command: "oha --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install oha"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id hatoo.oha --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install oha"

verify:
  - command: "oha --version"

version:
  current: "oha --version"
  latest: { github: hatoo/oha }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade oha"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id hatoo.oha --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install oha"

category: http

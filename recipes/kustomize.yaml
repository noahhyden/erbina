id: kustomize
kind: cli-tool
title: "kustomize — customization of Kubernetes YAML configurations"
description: >
  Kustomize introduces a template-free way to customize Kubernetes YAML
  configurations, layering overlays over a base without forking the
  original manifests. https://github.com/kubernetes-sigs/kustomize

detect:
  command: "kustomize version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install kustomize"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Kubernetes.kustomize --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "kustomize version"

version:
  current: "kustomize version"
  latest: { github: kubernetes-sigs/kustomize }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade kustomize"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Kubernetes.kustomize --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: kubernetes

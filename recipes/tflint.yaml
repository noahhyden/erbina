id: tflint
kind: cli-tool
title: "tflint — a pluggable Terraform linter"
description: >
  TFLint is a pluggable linter for Terraform that finds possible errors,
  warns about deprecated syntax, and enforces best-practice conventions.
  https://github.com/terraform-linters/tflint

detect:
  command: "tflint --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install tflint"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id TerraformLinters.tflint --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "tflint --version"

version:
  current: "tflint --version"
  latest: { github: terraform-linters/tflint }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade tflint"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id TerraformLinters.tflint --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: cloud

id: cppcheck
kind: cli-tool
title: "cppcheck — a static analysis tool for C/C++ code"
description: >
  Cppcheck is a static analysis tool for C/C++ code that detects bugs and
  focuses on undefined behavior and dangerous coding constructs with few
  false positives. https://github.com/danmar/cppcheck

detect:
  command: "cppcheck --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install cppcheck"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Cppcheck.Cppcheck --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "cppcheck --version"

version:
  current: "cppcheck --version"
  latest: { github: danmar/cppcheck }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade cppcheck"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Cppcheck.Cppcheck --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: text

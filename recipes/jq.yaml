# erbina recipe — jq, a cli-tool. Command-line JSON processor.
id: jq
kind: cli-tool
title: "jq — command-line JSON processor"
description: >
  jq is a lightweight, flexible command-line JSON processor — slice, filter, map,
  and transform structured data. Installs the `jq` binary. https://jqlang.org

# 1. DETECT — already installed? `jq --version` exits 0 when present.
detect:
  command: "jq --version"
  expect_exit: 0

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install jq"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id jqlang.jq --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: apt
      when: "command -v apt-get"
      run: "sudo apt-get install -y jq"

# 3. VERIFY — prove it actually runs.
verify:
  - command: "jq --version"
    expect_exit: 0

# Both the version output and the release tag are `jq-1.7.1`.
version:
  current: "jq --version"
  latest: { github: jqlang/jq }

# 5. UPDATE — brew upgrade, else apt --only-upgrade.
update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade jq"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id jqlang.jq --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: apt
      when: "command -v apt-get"
      run: "sudo apt-get install -y --only-upgrade jq"

scope: user

id: dprint
kind: cli-tool
title: "dprint — a pluggable and configurable code formatting platform"
description: >
  dprint is a pluggable and configurable code formatting platform written
  in Rust, formatting TypeScript, JSON, Markdown, TOML and more via WASM
  plugins. https://github.com/dprint/dprint

detect:
  command: "dprint --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install dprint"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id dprint.dprint --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install dprint"

verify:
  - command: "dprint --version"

version:
  current: "dprint --version"
  latest: { github: dprint/dprint }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade dprint"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id dprint.dprint --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install dprint"

category: data

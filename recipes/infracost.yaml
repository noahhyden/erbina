id: infracost
kind: cli-tool
title: "infracost — cloud cost estimates for Terraform in pull requests"
description: >
  Infracost shows cloud cost estimates for Terraform, so engineers can see
  the price impact of infrastructure changes right in their pull requests.
  https://github.com/infracost/infracost

detect:
  command: "infracost --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install infracost"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Infracost.Infracost --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "infracost --version"

version:
  current: "infracost --version"
  latest: { github: infracost/infracost }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade infracost"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Infracost.Infracost --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: cloud

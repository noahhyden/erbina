id: bun
kind: cli-tool
title: "bun — an incredibly fast JavaScript runtime, bundler, transpiler and package manager"
description: >
  Bun is an all-in-one JavaScript runtime, bundler, transpiler and package
  manager designed for speed, a drop-in-ish faster alternative to Node.js.
  https://github.com/oven-sh/bun

detect:
  command: "bun --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install bun"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Oven-sh.Bun --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "bun --version"

version:
  current: "bun --version"
  latest: { github: oven-sh/bun }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade bun"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Oven-sh.Bun --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: languages

id: act
kind: cli-tool
title: "act — run your GitHub Actions locally"
description: >
  act lets you run your GitHub Actions locally using Docker, giving fast
  feedback on workflow changes without pushing and waiting on CI.
  https://github.com/nektos/act

detect:
  command: "act --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install act"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id nektos.act --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "act --version"

version:
  current: "act --version"
  latest: { github: nektos/act }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade act"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id nektos.act --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


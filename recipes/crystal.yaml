id: crystal
kind: cli-tool
title: "crystal — a language for humans and computers, with Ruby-like syntax and native speed"
description: >
  Crystal is a programming language with Ruby-inspired syntax that
  compiles to efficient native code with static type checking and a
  built-in concurrency model. https://github.com/crystal-lang/crystal

detect:
  command: "crystal --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install crystal"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id CrystalLang.Crystal --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "crystal --version"

version:
  current: "crystal --version"
  latest: { github: crystal-lang/crystal }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade crystal"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id CrystalLang.Crystal --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: languages

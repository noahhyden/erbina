id: brotli
kind: cli-tool
title: "brotli — a generic-purpose lossless compression algorithm"
description: >
  Brotli is a generic-purpose lossless compression algorithm that
  compresses data with a high ratio, widely used for compressing web
  assets. https://github.com/google/brotli

detect:
  command: "brotli --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install brotli"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Google.Brotli --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "brotli --version"

version:
  current: "brotli --version"
  latest: { github: google/brotli }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade brotli"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Google.Brotli --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: compression

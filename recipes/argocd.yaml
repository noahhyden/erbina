id: argocd
kind: cli-tool
title: "argocd — the CLI for Argo CD, declarative GitOps continuous delivery for Kubernetes"
description: >
  The argocd CLI drives Argo CD, a declarative GitOps continuous-delivery
  tool for Kubernetes, managing apps, syncs and cluster/repo
  registrations. https://github.com/argoproj/argo-cd

detect:
  command: "argocd version --client"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install argocd"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id argoproj.argocd --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "argocd version --client"

version:
  current: "argocd version --client"
  latest: { github: argoproj/argo-cd }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade argocd"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id argoproj.argocd --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


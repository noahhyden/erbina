id: hadolint
kind: cli-tool
title: "hadolint — a smarter Dockerfile linter"
description: >
  Haskell Dockerfile Linter (hadolint) is a smarter Dockerfile linter that
  helps you build best-practice Docker images by validating instructions.
  https://github.com/hadolint/hadolint

detect:
  command: "hadolint --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install hadolint"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id hadolint.hadolint --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "hadolint --version"

version:
  current: "hadolint --version"
  latest: { github: hadolint/hadolint }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade hadolint"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id hadolint.hadolint --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: containers

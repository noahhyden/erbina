id: presenterm
kind: cli-tool
title: "presenterm — markdown terminal slideshows"
description: >
  presenterm lets you create and present slideshows from markdown directly
  in the terminal, with code highlighting, images and speaker notes.
  https://github.com/mfontanini/presenterm

detect:
  command: "presenterm --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install presenterm"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id mfontanini.presenterm --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install presenterm"

verify:
  - command: "presenterm --version"

version:
  current: "presenterm --version"
  latest: { github: mfontanini/presenterm }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade presenterm"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id mfontanini.presenterm --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install presenterm"


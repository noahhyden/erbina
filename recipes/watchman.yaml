id: watchman
kind: cli-tool
title: "watchman — a file watching service from Meta"
description: >
  Watchman is a file-watching service that watches files and records or
  triggers actions when they change, powering fast rebuilds in large
  repositories. https://github.com/facebook/watchman

detect:
  command: "watchman --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install watchman"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id facebook.watchman --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "watchman --version"

version:
  current: "watchman --version"
  latest: { github: facebook/watchman }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade watchman"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id facebook.watchman --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


id: hexyl
kind: cli-tool
title: "hexyl — a command-line hex viewer"
description: >
  hexyl is a simple hex viewer for the terminal that uses colored output
  to distinguish byte categories (NULL, printable ASCII, whitespace,
  etc.). https://github.com/sharkdp/hexyl

detect:
  command: "hexyl --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install hexyl"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id sharkdp.hexyl --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install hexyl"

verify:
  - command: "hexyl --version"

version:
  current: "hexyl --version"
  latest: { github: sharkdp/hexyl }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade hexyl"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id sharkdp.hexyl --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install hexyl"


id: goreleaser
kind: cli-tool
title: "goreleaser — deliver Go binaries as fast and easily as possible"
description: >
  GoReleaser builds, archives, packages and publishes Go project releases
  (binaries, checksums, Homebrew taps, Docker images) from a single YAML
  configuration. https://github.com/goreleaser/goreleaser

detect:
  command: "goreleaser --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install goreleaser"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id goreleaser.goreleaser --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "goreleaser --version"

version:
  current: "goreleaser --version"
  latest: { github: goreleaser/goreleaser }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade goreleaser"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id goreleaser.goreleaser --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: containers

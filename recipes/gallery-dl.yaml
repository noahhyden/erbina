id: gallery-dl
kind: cli-tool
title: "gallery-dl — download image galleries and collections from several image hosting sites"
description: >
  gallery-dl is a command-line program to download image galleries and
  collections from several image-hosting sites, with rich configuration
  and filtering. https://github.com/mikf/gallery-dl

detect:
  command: "gallery-dl --version"

install:
  methods:
    - id: winget
      when: "winget --version"
      run: "winget install -e --id mikf.gallery-dl --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx install gallery-dl"

verify:
  - command: "gallery-dl --version"

version:
  current: "gallery-dl --version"
  latest: { github: mikf/gallery-dl }

update:
  methods:
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id mikf.gallery-dl --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx upgrade gallery-dl"


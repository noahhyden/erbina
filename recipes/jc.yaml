id: jc
kind: cli-tool
title: "jc — convert the output of many CLI tools and file types to JSON"
description: >
  jc converts the output of dozens of common command-line tools and file
  types to JSON, making legacy tool output easy to process in scripts and
  jq. https://github.com/kellyjonbrazil/jc

detect:
  command: "jc --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install jc"
    - id: pipx
      when: "command -v pipx"
      run: "pipx install jc"

verify:
  - command: "jc --version"

version:
  current: "jc --version"
  latest: { github: kellyjonbrazil/jc }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade jc"
    - id: pipx
      when: "command -v pipx"
      run: "pipx upgrade jc"

category: data

id: ninja
kind: cli-tool
title: "ninja — a small build system with a focus on speed"
description: >
  Ninja is a small build system with a focus on speed, designed to have
  its input files generated by a higher-level build system and to run
  builds as fast as possible. https://github.com/ninja-build/ninja

detect:
  command: "ninja --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install ninja"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Ninja-build.Ninja --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "ninja --version"

version:
  current: "ninja --version"
  latest: { github: ninja-build/ninja }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade ninja"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Ninja-build.Ninja --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


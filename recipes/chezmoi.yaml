id: chezmoi
kind: cli-tool
title: "chezmoi — manage your dotfiles across multiple diverse machines, securely"
description: >
  chezmoi manages your dotfiles across multiple diverse machines securely,
  with templating, secret-manager integration and a git-backed source of
  truth. https://github.com/twpayne/chezmoi

detect:
  command: "chezmoi --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install chezmoi"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id twpayne.chezmoi --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "chezmoi --version"

version:
  current: "chezmoi --version"
  latest: { github: twpayne/chezmoi }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade chezmoi"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id twpayne.chezmoi --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


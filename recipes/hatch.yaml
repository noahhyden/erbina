id: hatch
kind: cli-tool
title: "hatch — a modern, extensible Python project manager"
description: >
  Hatch is a modern, extensible Python project manager from the PyPA that
  handles environments, building and publishing packages, and project
  scaffolding. https://github.com/pypa/hatch

detect:
  command: "hatch --version"

install:
  methods:
    - id: winget
      when: "winget --version"
      run: "winget install -e --id PyPA.Hatch --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx install hatch"

verify:
  - command: "hatch --version"

version:
  current: "hatch --version"
  latest: { github: pypa/hatch }

update:
  methods:
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id PyPA.Hatch --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx upgrade hatch"

category: packaging

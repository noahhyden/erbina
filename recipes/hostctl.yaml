id: hostctl
kind: cli-tool
title: "hostctl — a CLI tool to manage /etc/hosts with ease"
description: >
  hostctl is a CLI tool to manage /etc/hosts with profiles, letting you
  enable, disable and group host entries without hand-editing the file.
  https://github.com/guumaster/hostctl

detect:
  command: "hostctl --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install hostctl"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Natthasath.hostctl --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "hostctl --version"

version:
  current: "hostctl --version"
  latest: { github: guumaster/hostctl }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade hostctl"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Natthasath.hostctl --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: files

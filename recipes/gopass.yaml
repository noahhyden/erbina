id: gopass
kind: cli-tool
title: "gopass — the slightly more awesome standard unix password manager for teams"
description: >
  gopass is a rewrite of the standard unix password manager pass with
  team-friendly features like multiple stores, secret sharing and rich
  integrations. https://github.com/gopasspw/gopass

detect:
  command: "gopass --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install gopass"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id gopass.gopass --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "gopass --version"

version:
  current: "gopass --version"
  latest: { github: gopasspw/gopass }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade gopass"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id gopass.gopass --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


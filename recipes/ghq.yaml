id: ghq
kind: cli-tool
title: "ghq — manage remote repository clones"
description: >
  ghq provides a way to organize remote repository clones under a
  consistent directory tree, cloning by URL and integrating well with fzf
  for navigation. https://github.com/x-motemen/ghq

detect:
  command: "ghq --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install ghq"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id x-motemen.ghq --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "ghq --version"

version:
  current: "ghq --version"
  latest: { github: x-motemen/ghq }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade ghq"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id x-motemen.ghq --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: git

id: shfmt
kind: cli-tool
title: "shfmt — a shell parser, formatter, and interpreter"
description: >
  shfmt is a shell parser and formatter (part of mvdan/sh) that formats
  POSIX sh, bash, and mksh scripts consistently, with an interpreter too.
  https://github.com/mvdan/sh

detect:
  command: "shfmt --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install shfmt"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id mvdan.shfmt --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install mvdan.cc/sh/v3/cmd/shfmt@latest"

verify:
  - command: "shfmt --version"

version:
  current: "shfmt --version"
  latest: { github: mvdan/sh }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade shfmt"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id mvdan.shfmt --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install mvdan.cc/sh/v3/cmd/shfmt@latest"


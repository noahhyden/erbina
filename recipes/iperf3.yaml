id: iperf3
kind: cli-tool
title: "iperf3 — a TCP, UDP and SCTP network bandwidth measurement tool"
description: >
  iperf3 is a tool for active measurements of the maximum achievable
  bandwidth on IP networks, supporting tuning of timing, protocols and
  buffers. https://github.com/esnet/iperf

detect:
  command: "iperf3 --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install iperf3"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id ar51an.iPerf3 --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "iperf3 --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade iperf3"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id ar51an.iPerf3 --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: network

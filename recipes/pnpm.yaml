id: pnpm
kind: cli-tool
title: "pnpm — fast, disk space-efficient package manager"
description: >
  pnpm is a fast, disk-space-efficient package manager for Node.js that
  uses a content-addressable store and strict, non-flat node_modules.
  https://github.com/pnpm/pnpm

detect:
  command: "pnpm --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install pnpm"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id pnpm.pnpm --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: npm
      when: "command -v npm"
      run: "npm install -g pnpm"

verify:
  - command: "pnpm --version"

version:
  current: "pnpm --version"
  latest: { github: pnpm/pnpm }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade pnpm"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id pnpm.pnpm --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: npm
      when: "command -v npm"
      run: "npm update -g pnpm"


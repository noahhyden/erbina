id: flac
kind: cli-tool
title: "flac — the reference implementation of the Free Lossless Audio Codec"
description: >
  FLAC is the Free Lossless Audio Codec; the flac command encodes and
  decodes audio to and from the lossless FLAC format from the command
  line. https://github.com/xiph/flac

detect:
  command: "flac --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install flac"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Xiph.FLAC --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "flac --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade flac"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Xiph.FLAC --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


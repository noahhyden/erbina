id: ffmpeg
kind: cli-tool
title: "ffmpeg — a complete solution to record, convert and stream audio and video"
description: >
  FFmpeg is a complete, cross-platform solution to record, convert and
  stream audio and video, the de facto standard for media processing on
  the CLI. https://ffmpeg.org/

detect:
  command: "ffmpeg -version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install ffmpeg"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Gyan.FFmpeg --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "ffmpeg -version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade ffmpeg"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Gyan.FFmpeg --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


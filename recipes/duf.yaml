id: duf
kind: cli-tool
title: "duf — disk usage/free utility, a better df alternative"
description: >
  duf is a disk usage/free utility, a better df alternative that renders
  device and filesystem usage in colorful, sortable tables.
  https://github.com/muesli/duf

detect:
  command: "duf --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install duf"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id muesli.duf --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install github.com/muesli/duf@latest"

verify:
  - command: "duf --version"

version:
  current: "duf --version"
  latest: { github: muesli/duf }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade duf"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id muesli.duf --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install github.com/muesli/duf@latest"

category: monitoring

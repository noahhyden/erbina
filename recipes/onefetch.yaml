id: onefetch
kind: cli-tool
title: "onefetch — a git repository summary in your terminal"
description: >
  onefetch is a command-line git information tool that displays project
  stats, contributors, and language breakdown alongside an ASCII logo for
  the repo. https://github.com/o2sh/onefetch

detect:
  command: "onefetch --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install onefetch"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id o2sh.onefetch --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install onefetch"

verify:
  - command: "onefetch --version"

version:
  current: "onefetch --version"
  latest: { github: o2sh/onefetch }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade onefetch"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id o2sh.onefetch --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install onefetch"


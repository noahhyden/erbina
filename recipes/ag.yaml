id: ag
kind: cli-tool
title: "the_silver_searcher — a code-searching tool similar to ack, but faster (`ag`)"
description: >
  The Silver Searcher (ag) is a code-searching tool similar to ack but
  much faster, ignoring files matched by .gitignore and searching huge
  trees quickly. https://github.com/ggreer/the_silver_searcher

detect:
  command: "ag --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install the_silver_searcher"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id JFLarvoire.Ag --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "ag --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade the_silver_searcher"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id JFLarvoire.Ag --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


id: nmap
kind: cli-tool
title: "nmap — the network mapper, a utility for network discovery and security auditing"
description: >
  Nmap (Network Mapper) is a utility for network discovery and security
  auditing, probing hosts and services and fingerprinting operating
  systems. https://nmap.org/

detect:
  command: "nmap --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install nmap"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Insecure.Nmap --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "nmap --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade nmap"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Insecure.Nmap --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: network

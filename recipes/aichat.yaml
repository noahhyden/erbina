id: aichat
kind: cli-tool
title: "aichat — all-in-one LLM CLI tool"
description: >
  aichat is an all-in-one LLM CLI tool featuring a shell assistant, chat
  REPL, roles, sessions and RAG, working across many model providers from
  the terminal. https://github.com/sigoden/aichat

detect:
  command: "aichat --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install aichat"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id sigoden.AIChat --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install aichat"

verify:
  - command: "aichat --version"

version:
  current: "aichat --version"
  latest: { github: sigoden/aichat }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade aichat"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id sigoden.AIChat --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install aichat"

category: devtools

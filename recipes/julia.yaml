id: julia
kind: cli-tool
title: "julia — a high-level, high-performance dynamic language for technical computing"
description: >
  Julia is a high-level, high-performance dynamic programming language for
  technical computing, combining the ease of Python with the speed of C.
  https://github.com/JuliaLang/julia

detect:
  command: "julia --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install julia"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Julialang.Julia --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "julia --version"

version:
  current: "julia --version"
  latest: { github: JuliaLang/julia }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade julia"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Julialang.Julia --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: languages

id: golangci-lint
kind: cli-tool
title: "golangci-lint — fast linters runner for Go"
description: >
  golangci-lint is a fast Go linters runner that bundles dozens of
  linters, runs them in parallel, caches results, and integrates cleanly
  with editors and CI. https://github.com/golangci/golangci-lint

detect:
  command: "golangci-lint --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install golangci-lint"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id GolangCI.golangci-lint --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "golangci-lint --version"

version:
  current: "golangci-lint --version"
  latest: { github: golangci/golangci-lint }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade golangci-lint"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id GolangCI.golangci-lint --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: editors

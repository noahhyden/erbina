id: kind
kind: cli-tool
title: "kind — Kubernetes IN Docker"
description: >
  kind is a tool for running local Kubernetes clusters using Docker
  container nodes, primarily designed for testing Kubernetes itself and
  CI. https://github.com/kubernetes-sigs/kind

detect:
  command: "kind --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install kind"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Kubernetes.kind --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install sigs.k8s.io/kind@latest"

verify:
  - command: "kind --version"

version:
  current: "kind --version"
  latest: { github: kubernetes-sigs/kind }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade kind"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Kubernetes.kind --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install sigs.k8s.io/kind@latest"


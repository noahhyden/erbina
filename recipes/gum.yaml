id: gum
kind: cli-tool
title: "gum — a tool for glamorous shell scripts"
description: >
  Gum provides highly configurable, ready-to-use interactive components
  (input, choose, filter, spin, confirm) for writing glamorous shell
  scripts. https://github.com/charmbracelet/gum

detect:
  command: "gum --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install gum"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id charmbracelet.gum --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install github.com/charmbracelet/gum@latest"

verify:
  - command: "gum --version"

version:
  current: "gum --version"
  latest: { github: charmbracelet/gum }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade gum"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id charmbracelet.gum --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install github.com/charmbracelet/gum@latest"


id: gifski
kind: cli-tool
title: "gifski — the highest-quality GIF encoder based on pngquant"
description: >
  gifski is a command-line tool and library that converts video frames to
  high-quality animated GIFs using pngquant's per-frame palettes and
  temporal dithering. https://github.com/ImageOptim/gifski

detect:
  command: "gifski --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install gifski"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id ImageOptim.gifski --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install gifski"

verify:
  - command: "gifski --version"

version:
  current: "gifski --version"
  latest: { github: ImageOptim/gifski }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade gifski"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id ImageOptim.gifski --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install gifski"

category: media

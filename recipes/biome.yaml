id: biome
kind: cli-tool
title: "biome — a performant toolchain for web projects: format, lint and more"
description: >
  Biome is a performant toolchain for web projects that formats and lints
  JavaScript, TypeScript, JSON and CSS, a fast Rust-based alternative to
  Prettier and ESLint. https://github.com/biomejs/biome

detect:
  command: "biome --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install biome"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id BiomeJS.Biome --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: npm
      when: "command -v npm"
      run: "npm install -g @biomejs/biome"

verify:
  - command: "biome --version"

version:
  current: "biome --version"
  latest: { github: biomejs/biome }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade biome"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id BiomeJS.Biome --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: npm
      when: "command -v npm"
      run: "npm update -g @biomejs/biome"


id: mise
kind: cli-tool
title: "mise — the front-end to your dev env"
description: >
  mise (formerly rtx) manages developer tool versions (node, python, go,
  and more), environment variables, and project tasks from a single
  config, asdf-compatible. https://github.com/jdx/mise

detect:
  command: "mise --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install mise"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id jdx.mise --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install mise"

verify:
  - command: "mise --version"

version:
  current: "mise --version"
  latest: { github: jdx/mise }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade mise"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id jdx.mise --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install mise"

category: languages

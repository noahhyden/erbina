id: mitmproxy
kind: cli-tool
title: "mitmproxy — an interactive HTTPS proxy for intercepting, inspecting and modifying traffic"
description: >
  mitmproxy is an interactive, SSL/TLS-capable intercepting proxy for
  HTTP/HTTPS with a console interface, letting you inspect and modify
  traffic on the fly. https://github.com/mitmproxy/mitmproxy

detect:
  command: "mitmproxy --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install mitmproxy"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id mitmproxy.mitmproxy --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx install mitmproxy"

verify:
  - command: "mitmproxy --version"

version:
  current: "mitmproxy --version"
  latest: { github: mitmproxy/mitmproxy }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade mitmproxy"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id mitmproxy.mitmproxy --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx upgrade mitmproxy"


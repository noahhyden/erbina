id: typos
kind: cli-tool
title: "typos — source code spell checker"
description: >
  typos is a source-code spell checker designed for low false positives so
  it is fast enough to run in CI and pre-commit across a whole repository.
  https://github.com/crate-ci/typos

detect:
  command: "typos --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install typos-cli"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Crate-CI.Typos --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install typos-cli"

verify:
  - command: "typos --version"

version:
  current: "typos --version"
  latest: { github: crate-ci/typos }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade typos-cli"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Crate-CI.Typos --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install typos-cli"

category: text

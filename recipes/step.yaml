id: step
kind: cli-tool
title: "step — a zero-trust swiss-army knife for working with certificates and CAs"
description: >
  step is a zero-trust command-line tool for building, operating and
  automating public key infrastructure: create certificates, run a CA, and
  manage keys. https://github.com/smallstep/cli

detect:
  command: "step version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install step"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Smallstep.step --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "step version"

version:
  current: "step version"
  latest: { github: smallstep/cli }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade step"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Smallstep.step --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


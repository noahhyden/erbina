id: stylua
kind: cli-tool
title: "stylua — an opinionated Lua code formatter"
description: >
  StyLua is an opinionated code formatter for Lua, supporting Lua 5.1
  through 5.4 and Luau, producing consistent formatting for Neovim configs
  and games. https://github.com/JohnnyMorganz/StyLua

detect:
  command: "stylua --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install stylua"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id JohnnyMorganz.StyLua --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install stylua"

verify:
  - command: "stylua --version"

version:
  current: "stylua --version"
  latest: { github: JohnnyMorganz/StyLua }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade stylua"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id JohnnyMorganz.StyLua --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install stylua"


id: k9s
kind: cli-tool
title: "k9s — Kubernetes CLI to manage your clusters in style"
description: >
  K9s provides a terminal UI to interact with your Kubernetes clusters,
  making it easier to navigate, observe and manage deployed applications.
  https://github.com/derailed/k9s

detect:
  command: "k9s --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install k9s"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Derailed.k9s --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "k9s --version"

version:
  current: "k9s --version"
  latest: { github: derailed/k9s }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade k9s"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Derailed.k9s --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


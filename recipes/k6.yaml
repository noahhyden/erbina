id: k6
kind: cli-tool
title: "k6 — a modern load testing tool for engineering teams"
description: >
  Grafana k6 is a modern load-testing tool that lets engineering teams
  write performance tests as JavaScript and run them from the CLI or in
  CI. https://github.com/grafana/k6

detect:
  command: "k6 version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install k6"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id GrafanaLabs.k6 --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "k6 version"

version:
  current: "k6 version"
  latest: { github: grafana/k6 }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade k6"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id GrafanaLabs.k6 --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: benchmarking

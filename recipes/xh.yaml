id: xh
kind: cli-tool
title: "xh — a friendly and fast tool for sending HTTP requests"
description: >
  xh is a friendly and fast tool for sending HTTP requests, reimplementing
  the expressive HTTPie syntax in Rust for near-instant startup.
  https://github.com/ducaale/xh

detect:
  command: "xh --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install xh"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id ducaale.xh --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install xh"

verify:
  - command: "xh --version"

version:
  current: "xh --version"
  latest: { github: ducaale/xh }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade xh"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id ducaale.xh --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install xh"


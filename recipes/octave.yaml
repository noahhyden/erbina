id: octave
kind: cli-tool
title: "octave — a high-level language primarily intended for numerical computations"
description: >
  GNU Octave is a high-level language primarily intended for numerical
  computations, largely compatible with MATLAB, with a powerful
  command-line interface. https://www.gnu.org/software/octave/

detect:
  command: "octave --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install octave"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id GNU.Octave --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "octave --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade octave"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id GNU.Octave --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: languages

id: datamash
kind: cli-tool
title: "datamash — a command-line program which performs basic numeric, textual and statistical operations on input textual data"
description: >
  GNU datamash performs basic numeric, textual and statistical operations
  on input data, grouping, summing and computing stats on columns from the
  command line. https://www.gnu.org/software/datamash/

detect:
  command: "datamash --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install datamash"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id GNU.datamash --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "datamash --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade datamash"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id GNU.datamash --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


id: speedtest-cli
kind: cli-tool
title: "speedtest-cli — command line interface for testing internet bandwidth using speedtest.net"
description: >
  speedtest-cli is a command-line interface for testing internet bandwidth
  using speedtest.net, reporting download, upload and latency numbers.
  https://github.com/sivel/speedtest-cli

detect:
  command: "speedtest-cli --version"

install:
  methods:
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Ookla.Speedtest.CLI --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx install speedtest-cli"

verify:
  - command: "speedtest-cli --version"

version:
  current: "speedtest-cli --version"
  latest: { github: sivel/speedtest-cli }

update:
  methods:
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Ookla.Speedtest.CLI --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx upgrade speedtest-cli"


id: kopia
kind: cli-tool
title: "kopia — a fast and secure open-source backup/restore tool"
description: >
  Kopia is a fast and secure open-source backup/restore tool that creates
  encrypted, deduplicated, compressed snapshots to cloud or local
  repositories. https://github.com/kopia/kopia

detect:
  command: "kopia --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install kopia"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Kopia.KopiaCLI --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "kopia --version"

version:
  current: "kopia --version"
  latest: { github: kopia/kopia }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade kopia"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Kopia.KopiaCLI --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


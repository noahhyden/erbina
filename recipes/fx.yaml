id: fx
kind: cli-tool
title: "fx — terminal JSON viewer and processor"
description: >
  fx is a terminal JSON viewer and processor with an interactive mode for
  exploring documents and a streaming mode for transforming them.
  https://github.com/antonmedv/fx

detect:
  command: "fx --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install fx"
    - id: go
      when: "command -v go"
      run: "go install github.com/antonmedv/fx@latest"

verify:
  - command: "fx --version"

version:
  current: "fx --version"
  latest: { github: antonmedv/fx }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade fx"
    - id: go
      when: "command -v go"
      run: "go install github.com/antonmedv/fx@latest"

category: data

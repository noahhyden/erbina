id: azure-cli
kind: cli-tool
title: "azure-cli — the command-line tools for managing Azure resources (`az`)"
description: >
  The Azure CLI (az) is a set of commands to create and manage Azure
  resources from the terminal or in automation scripts, across the Azure
  platform. https://github.com/Azure/azure-cli

detect:
  command: "az version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install azure-cli"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Microsoft.AzureCLI --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "az version"

version:
  current: "az version"
  latest: { github: Azure/azure-cli }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade azure-cli"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Microsoft.AzureCLI --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: cloud

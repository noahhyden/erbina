id: cloudflared
kind: cli-tool
title: "cloudflared — Cloudflare Tunnel client"
description: >
  cloudflared is the Cloudflare Tunnel client that creates secure
  outbound-only connections between your origins and Cloudflare's edge,
  exposing services without opening ports.
  https://github.com/cloudflare/cloudflared

detect:
  command: "cloudflared --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install cloudflared"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Cloudflare.cloudflared --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "cloudflared --version"

version:
  current: "cloudflared --version"
  latest: { github: cloudflare/cloudflared }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade cloudflared"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Cloudflare.cloudflared --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


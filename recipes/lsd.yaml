id: lsd
kind: cli-tool
title: "lsd — the next-gen ls command"
description: >
  lsd is a rewrite of ls with lots of added features like colors, icons,
  tree-view and more formatting options for a friendlier directory
  listing. https://github.com/lsd-rs/lsd

detect:
  command: "lsd --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install lsd"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id lsd-rs.lsd --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install lsd"

verify:
  - command: "lsd --version"

version:
  current: "lsd --version"
  latest: { github: lsd-rs/lsd }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade lsd"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id lsd-rs.lsd --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install lsd"

category: files

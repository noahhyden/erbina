id: aws-sam-cli
kind: cli-tool
title: "aws-sam-cli — build and test serverless applications with the AWS Serverless Application Model (`sam`)"
description: >
  The AWS SAM CLI (sam) is a tool for building, testing and deploying
  serverless applications defined with the AWS Serverless Application
  Model. https://github.com/aws/aws-sam-cli

detect:
  command: "sam --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install aws-sam-cli"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Amazon.SAM-CLI --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "sam --version"

version:
  current: "sam --version"
  latest: { github: aws/aws-sam-cli }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade aws-sam-cli"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Amazon.SAM-CLI --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: cloud

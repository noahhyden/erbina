id: opam
kind: cli-tool
title: "opam — the OCaml package manager"
description: >
  opam is a source-based package manager for OCaml that supports multiple
  simultaneous compiler installations, sandboxed builds and flexible
  switches. https://github.com/ocaml/opam

detect:
  command: "opam --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install opam"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id OCaml.opam --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "opam --version"

version:
  current: "opam --version"
  latest: { github: ocaml/opam }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade opam"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id OCaml.opam --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: languages

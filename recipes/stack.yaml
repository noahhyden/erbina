id: stack
kind: cli-tool
title: "stack — the Haskell Tool Stack, a cross-platform build tool for Haskell projects"
description: >
  Stack is a cross-platform build tool for Haskell that manages GHC
  versions and dependencies, giving reproducible builds without global
  state. https://github.com/commercialhaskell/stack

detect:
  command: "stack --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install haskell-stack"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id commercialhaskell.stack --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "stack --version"

version:
  current: "stack --version"
  latest: { github: commercialhaskell/stack }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade haskell-stack"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id commercialhaskell.stack --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


id: cmake
kind: cli-tool
title: "cmake — a cross-platform family of tools designed to build, test and package software"
description: >
  CMake is a cross-platform family of tools designed to build, test and
  package software, generating native build files from a
  compiler-independent configuration. https://github.com/Kitware/CMake

detect:
  command: "cmake --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install cmake"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Kitware.CMake --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "cmake --version"

version:
  current: "cmake --version"
  latest: { github: Kitware/CMake }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade cmake"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Kitware.CMake --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: build

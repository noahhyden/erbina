id: eksctl
kind: cli-tool
title: "eksctl — the official CLI for Amazon EKS"
description: >
  eksctl is the official CLI for Amazon EKS, creating and managing
  Kubernetes clusters on AWS with a single command and sensible defaults.
  https://github.com/eksctl-io/eksctl

detect:
  command: "eksctl version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install eksctl"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id eksctl.eksctl --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "eksctl version"

version:
  current: "eksctl version"
  latest: { github: eksctl-io/eksctl }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade eksctl"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id eksctl.eksctl --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


id: aws-vault
kind: cli-tool
title: "aws-vault — a vault for securely storing and accessing AWS credentials"
description: >
  aws-vault is a tool to securely store and access AWS credentials in a
  development environment, generating temporary credentials and keeping
  keys out of plaintext. https://github.com/99designs/aws-vault

detect:
  command: "aws-vault --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install aws-vault"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id 99designs.aws-vault --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "aws-vault --version"

version:
  current: "aws-vault --version"
  latest: { github: 99designs/aws-vault }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade aws-vault"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id 99designs.aws-vault --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: cloud

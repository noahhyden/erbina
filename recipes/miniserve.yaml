id: miniserve
kind: cli-tool
title: "miniserve — a small, self-contained static file server"
description: >
  miniserve is a small, self-contained cross-platform CLI tool that lets
  you serve files and directories over HTTP with a single command.
  https://github.com/svenstaro/miniserve

detect:
  command: "miniserve --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install miniserve"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id svenstaro.miniserve --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install miniserve"

verify:
  - command: "miniserve --version"

version:
  current: "miniserve --version"
  latest: { github: svenstaro/miniserve }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade miniserve"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id svenstaro.miniserve --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install miniserve"

category: http

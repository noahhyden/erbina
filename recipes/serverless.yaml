id: serverless
kind: cli-tool
title: "serverless — build and deploy serverless applications across cloud providers"
description: >
  The Serverless Framework helps you build and deploy serverless
  applications and functions across AWS and other providers with a simple
  YAML configuration. https://github.com/serverless/serverless

detect:
  command: "serverless --version"

install:
  methods:
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Serverless.Serverless --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: npm
      when: "command -v npm"
      run: "npm install -g serverless"

verify:
  - command: "serverless --version"

version:
  current: "serverless --version"
  latest: { github: serverless/serverless }

update:
  methods:
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Serverless.Serverless --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: npm
      when: "command -v npm"
      run: "npm update -g serverless"

category: cloud

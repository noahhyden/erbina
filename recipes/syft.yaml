id: syft
kind: cli-tool
title: "syft — generate a software bill of materials from container images and filesystems"
description: >
  Syft generates a Software Bill of Materials (SBOM) from container images
  and filesystems, cataloging packages across many ecosystems for
  supply-chain visibility. https://github.com/anchore/syft

detect:
  command: "syft --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install syft"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Anchore.Syft --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "syft --version"

version:
  current: "syft --version"
  latest: { github: anchore/syft }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade syft"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Anchore.Syft --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


id: zstd
kind: cli-tool
title: "zstd — Zstandard, a fast real-time compression algorithm"
description: >
  Zstandard (zstd) is a fast lossless compression algorithm targeting
  real-time compression scenarios with a wide range of speed/ratio
  trade-offs. https://github.com/facebook/zstd

detect:
  command: "zstd --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install zstd"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Meta.Zstandard --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "zstd --version"

version:
  current: "zstd --version"
  latest: { github: facebook/zstd }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade zstd"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Meta.Zstandard --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


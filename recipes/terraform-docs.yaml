id: terraform-docs
kind: cli-tool
title: "terraform-docs — generate documentation from Terraform modules"
description: >
  terraform-docs generates documentation from Terraform modules in various
  output formats, keeping module inputs, outputs and providers documented
  automatically. https://github.com/terraform-docs/terraform-docs

detect:
  command: "terraform-docs --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install terraform-docs"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Terraform-docs.Terraform-docs --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "terraform-docs --version"

version:
  current: "terraform-docs --version"
  latest: { github: terraform-docs/terraform-docs }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade terraform-docs"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Terraform-docs.Terraform-docs --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: cloud

id: imagemagick
kind: cli-tool
title: "imagemagick — create, edit, compose or convert digital images (`magick`)"
description: >
  ImageMagick is a software suite to create, edit, compose or convert
  digital images in over 200 formats from the command line via the magick
  command. https://github.com/ImageMagick/ImageMagick

detect:
  command: "magick --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install imagemagick"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id ImageMagick.ImageMagick --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "magick --version"

version:
  current: "magick --version"
  latest: { github: ImageMagick/ImageMagick }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade imagemagick"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id ImageMagick.ImageMagick --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: media

id: nomad
kind: cli-tool
title: "nomad — an easy-to-use, flexible, and performant workload orchestrator"
description: >
  HashiCorp Nomad is a simple and flexible workload orchestrator that
  deploys and manages containers and non-containerized applications across
  on-prem and cloud. https://github.com/hashicorp/nomad

detect:
  command: "nomad version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install nomad"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Hashicorp.Nomad --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "nomad version"

version:
  current: "nomad version"
  latest: { github: hashicorp/nomad }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade nomad"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Hashicorp.Nomad --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: containers

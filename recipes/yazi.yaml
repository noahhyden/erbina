id: yazi
kind: cli-tool
title: "yazi — blazing-fast terminal file manager"
description: >
  Yazi is a blazing-fast terminal file manager written in Rust with async
  I/O, image previews, and a plugin system for an efficient file-browsing
  experience. https://github.com/sxyazi/yazi

detect:
  command: "yazi --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install yazi"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id sxyazi.yazi --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "yazi --version"

version:
  current: "yazi --version"
  latest: { github: sxyazi/yazi }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade yazi"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id sxyazi.yazi --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: files

id: wasmer
kind: cli-tool
title: "wasmer — the leading WebAssembly runtime supporting WASI and Emscripten"
description: >
  Wasmer is a fast and secure WebAssembly runtime that enables running
  WASM everywhere, supporting WASI and Emscripten and embedding into many
  languages. https://github.com/wasmerio/wasmer

detect:
  command: "wasmer --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install wasmer"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Wasmer.Wasmer --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "wasmer --version"

version:
  current: "wasmer --version"
  latest: { github: wasmerio/wasmer }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade wasmer"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Wasmer.Wasmer --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


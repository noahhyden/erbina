id: stern
kind: cli-tool
title: "stern — multi pod and container log tailing for Kubernetes"
description: >
  stern lets you tail multiple pods and containers in Kubernetes at once,
  color-coding output by pod so you can follow logs across a whole
  deployment. https://github.com/stern/stern

detect:
  command: "stern --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install stern"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id stern.stern --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "stern --version"

version:
  current: "stern --version"
  latest: { github: stern/stern }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade stern"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id stern.stern --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


# erbina recipe — uv, a cli-tool. An extremely fast Python package/project manager.
id: uv
kind: cli-tool
title: "uv — an extremely fast Python package and project manager"
description: >
  uv is a fast Python package/project manager and script runner (a drop-in for
  pip/pip-tools/virtualenv and more), from Astral. Installs the `uv` binary.
  https://github.com/astral-sh/uv

# 1. DETECT — already installed? `uv --version` exits 0 when present.
detect:
  command: "uv --version"

# 2. INSTALL — prefer brew; else the official standalone installer (no sudo).
install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install uv"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id astral-sh.uv --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: standalone
      when: "command -v curl"
      run: "curl -LsSf https://astral.sh/uv/install.sh | sh"

# 3. VERIFY — prove it actually runs.
verify:
  - command: "uv --version"

# 4. VERSION — `uv --version` prints "uv 0.5.11 (<hash> <date>)"; tags are "0.5.11".
version:
  current: "uv --version"
  latest: { github: astral-sh/uv }

# Self-update only works for standalone-installer installs, so brew goes first.
update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade uv"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id astral-sh.uv --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: self
      when: "command -v uv"
      run: "uv self update"

# uv calls itself a script runner, so inference misses packaging; category is authored.
category: packaging

id: fnm
kind: cli-tool
title: "fnm — fast and simple Node.js version manager"
description: >
  fnm is a fast and simple Node.js version manager built in Rust, with
  cross-platform support and .node-version / .nvmrc awareness.
  https://github.com/Schniz/fnm

detect:
  command: "fnm --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install fnm"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Schniz.fnm --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install fnm"

verify:
  - command: "fnm --version"

version:
  current: "fnm --version"
  latest: { github: Schniz/fnm }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade fnm"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Schniz.fnm --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install fnm"

category: languages

id: kompose
kind: cli-tool
title: "kompose — go from Docker Compose to Kubernetes"
description: >
  Kompose is a tool to help users who are familiar with docker-compose
  move to Kubernetes by translating a Compose file into Kubernetes
  manifests. https://github.com/kubernetes/kompose

detect:
  command: "kompose version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install kompose"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Kubernetes.kompose --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "kompose version"

version:
  current: "kompose version"
  latest: { github: kubernetes/kompose }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade kompose"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Kubernetes.kompose --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: kubernetes

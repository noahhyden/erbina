id: fq
kind: cli-tool
title: "fq — jq for binary formats"
description: >
  fq is a tool, language and decoders for working with binary data; think
  jq, hexdump and Wireshark combined, letting you query many binary
  formats. https://github.com/wader/fq

detect:
  command: "fq --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install fq"

verify:
  - command: "fq --version"

version:
  current: "fq --version"
  latest: { github: wader/fq }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade fq"

category: data

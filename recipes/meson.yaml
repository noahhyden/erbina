id: meson
kind: cli-tool
title: "meson — a fast and user-friendly build system"
description: >
  Meson is an open-source build system meant to be fast and as
  user-friendly as possible, using a non-Turing-complete DSL and Ninja as
  its backend. https://github.com/mesonbuild/meson

detect:
  command: "meson --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install meson"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id mesonbuild.meson --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx install meson"

verify:
  - command: "meson --version"

version:
  current: "meson --version"
  latest: { github: mesonbuild/meson }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade meson"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id mesonbuild.meson --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx upgrade meson"

category: build

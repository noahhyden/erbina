# erbina recipe — ripgrep, a cli-tool. Fast recursive search (`rg`).
id: ripgrep
kind: cli-tool
title: "ripgrep (rg) — blazing-fast recursive search"
description: >
  ripgrep recursively searches directories for a regex pattern while respecting
  gitignore. Installs the `rg` binary. https://github.com/BurntSushi/ripgrep

# 1. DETECT — already installed? `rg --version` exits 0 when present.
detect:
  command: "rg --version"

# 2. INSTALL — first guard to pass wins. Prefer brew; fall back to cargo.
install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install ripgrep"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id BurntSushi.ripgrep.MSVC --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install ripgrep"

# 3. VERIFY — prove it actually runs.
verify:
  - command: "rg --version"

version:
  current: "rg --version"
  latest: { github: BurntSushi/ripgrep }

# 5. UPDATE — how `update` upgrades an installed rg (brew, else re-run cargo).
update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade ripgrep"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id BurntSushi.ripgrep.MSVC --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install ripgrep"
category: search

id: qpdf
kind: cli-tool
title: "qpdf — a command-line program that does structural, content-preserving transformations on PDF files"
description: >
  qpdf is a command-line program and library that does structural,
  content-preserving transformations on PDF files, such as linearizing,
  encrypting and splitting. https://github.com/qpdf/qpdf

detect:
  command: "qpdf --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install qpdf"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id QPDF.QPDF --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "qpdf --version"

version:
  current: "qpdf --version"
  latest: { github: qpdf/qpdf }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade qpdf"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id QPDF.QPDF --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


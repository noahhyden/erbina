id: btop
kind: cli-tool
title: "btop — a monitor of resources"
description: >
  btop is a resource monitor that shows usage and stats for processor,
  memory, disks, network and processes with a responsive, mouse-driven
  TUI. https://github.com/aristocratos/btop

detect:
  command: "btop --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install btop"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id aristocratos.btop4win --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "btop --version"

version:
  current: "btop --version"
  latest: { github: aristocratos/btop }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade btop"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id aristocratos.btop4win --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: monitoring

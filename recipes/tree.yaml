id: tree
kind: cli-tool
title: "tree — a recursive directory listing command"
description: >
  tree is a recursive directory listing program that produces a
  depth-indented listing of files, a quick way to visualize a directory
  hierarchy. https://oldmanprogrammer.net/source.php?dir=projects/tree

detect:
  command: "tree --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install tree"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id GnuWin32.Tree --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "tree --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade tree"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id GnuWin32.Tree --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: files

# erbina recipe — fd, a cli-tool. Fast, user-friendly alternative to `find`.
id: fd
kind: cli-tool
title: "fd — a fast, friendly alternative to find"
description: >
  fd is a simple, fast, and ergonomic alternative to `find`, with sensible
  defaults and gitignore awareness. Installs the `fd` binary.
  https://github.com/sharkdp/fd

# 1. DETECT — already installed? `fd --version` exits 0 when present.
detect:
  command: "fd --version"

# The cargo crate is `fd-find`, not `fd`.
install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install fd"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id sharkdp.fd --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install fd-find"

# 3. VERIFY — prove it actually runs.
verify:
  - command: "fd --version"

version:
  current: "fd --version"
  latest: { github: sharkdp/fd }

# 5. UPDATE — brew upgrade, else re-run the cargo install (upgrades in place).
update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade fd"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id sharkdp.fd --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install fd-find"

id: topgrade
kind: cli-tool
title: "topgrade — upgrade everything with one command"
description: >
  topgrade detects which package managers and tools you use and runs their
  upgrade commands in sequence, keeping your whole system up to date from
  one command. https://github.com/topgrade-rs/topgrade

detect:
  command: "topgrade --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install topgrade"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id topgrade-rs.topgrade --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install topgrade"

verify:
  - command: "topgrade --version"

version:
  current: "topgrade --version"
  latest: { github: topgrade-rs/topgrade }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade topgrade"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id topgrade-rs.topgrade --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install topgrade"

category: packaging

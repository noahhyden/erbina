id: dive
kind: cli-tool
title: "dive — a tool for exploring a docker image and layer contents"
description: >
  dive is a tool for exploring each layer in a docker image, discovering
  wasted space and shrinking the size of your Docker/OCI images.
  https://github.com/wagoodman/dive

detect:
  command: "dive --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install dive"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id wagoodman.dive --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "dive --version"

version:
  current: "dive --version"
  latest: { github: wagoodman/dive }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade dive"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id wagoodman.dive --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: containers

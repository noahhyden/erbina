id: jo
kind: cli-tool
title: "jo — a small utility to create JSON objects"
description: >
  jo is a small utility that creates JSON objects and arrays from
  command-line arguments, making it easy to emit well-formed JSON from
  shell scripts. https://github.com/jpmens/jo

detect:
  command: "jo -v"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install jo"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id jpmens.jo --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "jo -v"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade jo"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id jpmens.jo --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


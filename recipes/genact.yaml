id: genact
kind: cli-tool
title: "genact — a nonsense activity generator"
description: >
  genact is a nonsense activity generator that pretends to do serious work
  in the terminal, useful for looking busy or as a fun screensaver.
  https://github.com/svenstaro/genact

detect:
  command: "genact --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install genact"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id svenstaro.genact --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install genact"

verify:
  - command: "genact --version"

version:
  current: "genact --version"
  latest: { github: svenstaro/genact }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade genact"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id svenstaro.genact --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install genact"

category: terminal

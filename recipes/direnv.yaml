id: direnv
kind: cli-tool
title: "direnv — unclutter your .profile with per-directory environments"
description: >
  direnv is an extension for your shell that loads and unloads environment
  variables per directory via an .envrc file, keeping project-specific
  config out of your profile. https://github.com/direnv/direnv

detect:
  command: "direnv version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install direnv"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id direnv.direnv --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "direnv version"

version:
  current: "direnv version"
  latest: { github: direnv/direnv }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade direnv"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id direnv.direnv --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: shells

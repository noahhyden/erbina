id: mods
kind: cli-tool
title: "mods — AI on the command line"
description: >
  mods is a tool for adding AI to your command-line pipelines: pipe output
  into it and get an LLM response formatted as markdown, with model and
  prompt options. https://github.com/charmbracelet/mods

detect:
  command: "mods --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install mods"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id charmbracelet.mods --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install github.com/charmbracelet/mods@latest"

verify:
  - command: "mods --version"

version:
  current: "mods --version"
  latest: { github: charmbracelet/mods }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade mods"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id charmbracelet.mods --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install github.com/charmbracelet/mods@latest"

category: shells

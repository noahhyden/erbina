id: dbmate
kind: cli-tool
title: "dbmate — a lightweight, framework-agnostic database migration tool"
description: >
  dbmate is a lightweight, framework-agnostic database migration tool that
  keeps your schema in sync using plain SQL migration files across many
  databases. https://github.com/amacneil/dbmate

detect:
  command: "dbmate --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install dbmate"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id amacneil.dbmate --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "dbmate --version"

version:
  current: "dbmate --version"
  latest: { github: amacneil/dbmate }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade dbmate"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id amacneil.dbmate --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


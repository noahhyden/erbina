id: taplo
kind: cli-tool
title: "taplo — a versatile, feature-rich TOML toolkit"
description: >
  Taplo is a versatile, feature-rich TOML toolkit providing a formatter,
  linter and language server for validating and prettifying TOML files.
  https://github.com/tamasfe/taplo

detect:
  command: "taplo --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install taplo"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id tamasfe.taplo --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install taplo-cli"

verify:
  - command: "taplo --version"

version:
  current: "taplo --version"
  latest: { github: tamasfe/taplo }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade taplo"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id tamasfe.taplo --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install taplo-cli"


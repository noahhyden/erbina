id: freeze
kind: cli-tool
title: "freeze — generate images of code and terminal output"
description: >
  Freeze generates images of code and terminal output, producing crisp
  PNG/SVG screenshots from files or piped input for docs and social posts.
  https://github.com/charmbracelet/freeze

detect:
  command: "freeze --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install freeze"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id charmbracelet.freeze --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install github.com/charmbracelet/freeze@latest"

verify:
  - command: "freeze --version"

version:
  current: "freeze --version"
  latest: { github: charmbracelet/freeze }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade freeze"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id charmbracelet.freeze --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: go
      when: "command -v go"
      run: "go install github.com/charmbracelet/freeze@latest"


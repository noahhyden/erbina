id: typst
kind: cli-tool
title: "typst — a new markup-based typesetting system that is powerful and easy to learn"
description: >
  Typst is a new markup-based typesetting system that is powerful and easy
  to learn, designed as a modern, faster alternative to LaTeX for
  documents. https://github.com/typst/typst

detect:
  command: "typst --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install typst"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Typst.Typst --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install typst-cli"

verify:
  - command: "typst --version"

version:
  current: "typst --version"
  latest: { github: typst/typst }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade typst"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Typst.Typst --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install typst-cli"

category: docs

id: zellij
kind: cli-tool
title: "zellij — a terminal workspace and multiplexer"
description: >
  Zellij is a terminal workspace with batteries included: panes, tabs,
  layouts, and a plugin system, aimed at both new and power users.
  https://github.com/zellij-org/zellij

detect:
  command: "zellij --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install zellij"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Zellij.Zellij --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install zellij"

verify:
  - command: "zellij --version"

version:
  current: "zellij --version"
  latest: { github: zellij-org/zellij }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade zellij"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Zellij.Zellij --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install zellij"


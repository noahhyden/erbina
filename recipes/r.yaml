id: r
kind: cli-tool
title: "r — a free software environment for statistical computing and graphics (`R`)"
description: >
  R is a free software environment for statistical computing and graphics,
  providing a wide variety of statistical and graphical techniques from
  the command line. https://www.r-project.org/

detect:
  command: "R --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install r"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id RProject.R --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "R --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade r"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id RProject.R --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: data

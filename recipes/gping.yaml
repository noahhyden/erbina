id: gping
kind: cli-tool
title: "gping — ping, but with a graph"
description: >
  gping is ping with a live graph: it plots round-trip times in the
  terminal and can compare multiple hosts at once.
  https://github.com/orf/gping

detect:
  command: "gping --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install gping"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id orf.gping --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install gping"

verify:
  - command: "gping --version"

version:
  current: "gping --version"
  latest: { github: orf/gping }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade gping"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id orf.gping --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install gping"

category: network

id: glab
kind: cli-tool
title: "glab — an open-source GitLab CLI tool"
description: >
  glab is a GitLab CLI tool that brings GitLab merge requests, issues,
  pipelines and repositories to your terminal, next to your code.
  https://gitlab.com/gitlab-org/cli

detect:
  command: "glab --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install glab"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id GLab.GLab --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "glab --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade glab"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id GLab.GLab --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: terminal

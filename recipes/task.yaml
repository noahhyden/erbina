id: task
kind: cli-tool
title: "task — a task runner / build tool that aims to be simpler and easier to use than make"
description: >
  Task is a task runner and build tool that aims to be simpler and easier
  to use than GNU Make, defining tasks and dependencies in a readable YAML
  Taskfile. https://github.com/go-task/task

detect:
  command: "task --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install go-task"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Task.Task --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "task --version"

version:
  current: "task --version"
  latest: { github: go-task/task }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade go-task"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Task.Task --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: build

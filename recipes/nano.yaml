id: nano
kind: cli-tool
title: "nano — a small, friendly text editor for the terminal"
description: >
  GNU nano is a small and friendly text editor for the terminal, a
  beginner-friendly alternative to vi with on-screen key hints and simple
  editing. https://www.nano-editor.org/

detect:
  command: "nano --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install nano"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id GNU.Nano --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "nano --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade nano"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id GNU.Nano --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

category: editors

id: mediainfo
kind: cli-tool
title: "mediainfo — display technical and tag data for video and audio files"
description: >
  MediaInfo displays technical information and tags for video and audio
  files, reporting codecs, bitrates, durations and stream details from the
  command line. https://mediaarea.net/en/MediaInfo

detect:
  command: "mediainfo --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install mediainfo"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id MediaArea.MediaInfo --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "mediainfo --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade mediainfo"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id MediaArea.MediaInfo --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


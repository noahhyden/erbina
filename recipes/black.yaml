id: black
kind: cli-tool
title: "black — the uncompromising Python code formatter"
description: >
  Black is the uncompromising Python code formatter: by using it you agree
  to cede control over the minutiae of formatting for fast, consistent
  output. https://github.com/psf/black

detect:
  command: "black --version"

install:
  methods:
    - id: winget
      when: "winget --version"
      run: "winget install -e --id psf.black --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx install black"

verify:
  - command: "black --version"

version:
  current: "black --version"
  latest: { github: psf/black }

update:
  methods:
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id psf.black --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: pipx
      when: "command -v pipx"
      run: "pipx upgrade black"


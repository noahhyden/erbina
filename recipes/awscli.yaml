id: awscli
kind: cli-tool
title: "awscli — the AWS Command Line Interface (`aws`)"
description: >
  The AWS Command Line Interface (aws) is a unified tool to manage AWS
  services from the terminal, scripting operations across the full breadth
  of AWS APIs. https://github.com/aws/aws-cli

detect:
  command: "aws --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install awscli"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Amazon.AWSCLI --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "aws --version"

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade awscli"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Amazon.AWSCLI --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


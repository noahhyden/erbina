id: mkcert
kind: cli-tool
title: "mkcert — a simple tool for making locally-trusted development certificates"
description: >
  mkcert is a simple zero-config tool to make locally-trusted development
  certificates, installing a local CA into the system and browser trust
  stores. https://github.com/FiloSottile/mkcert

detect:
  command: "mkcert --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install mkcert"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id FiloSottile.mkcert --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"

verify:
  - command: "mkcert --version"

version:
  current: "mkcert --version"
  latest: { github: FiloSottile/mkcert }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade mkcert"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id FiloSottile.mkcert --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"


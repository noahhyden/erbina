id: sccache
kind: cli-tool
title: "sccache — shared compilation cache"
description: >
  sccache is a ccache-like compiler caching tool that supports C/C++, Rust
  and other compilers, with optional cloud storage backends.
  https://github.com/mozilla/sccache

detect:
  command: "sccache --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install sccache"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Mozilla.sccache --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install sccache"

verify:
  - command: "sccache --version"

version:
  current: "sccache --version"
  latest: { github: mozilla/sccache }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade sccache"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Mozilla.sccache --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install sccache"

category: cloud

id: atuin
kind: cli-tool
title: "atuin — magical shell history"
description: >
  Atuin replaces your shell history with a searchable, syncable SQLite
  database, adding context (exit code, duration, directory) and optional
  end-to-end-encrypted sync. https://github.com/atuinsh/atuin

detect:
  command: "atuin --version"

install:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew install atuin"
    - id: winget
      when: "winget --version"
      run: "winget install -e --id Atuinsh.Atuin --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install atuin"

verify:
  - command: "atuin --version"

version:
  current: "atuin --version"
  latest: { github: atuinsh/atuin }

update:
  methods:
    - id: homebrew
      when: "command -v brew"
      run: "brew upgrade atuin"
    - id: winget
      when: "winget --version"
      run: "winget upgrade -e --id Atuinsh.Atuin --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity"
    - id: cargo
      when: "command -v cargo"
      run: "cargo install atuin"

category: database

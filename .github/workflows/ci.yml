name: CI

# Lint, test on Linux + macOS, 3.10 floor import check, release metadata; no build, deps via `uv --with`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint: ruff (version-pinned so new rules cannot redden a green PR), byte-compile, recipe linter.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uvx ruff@0.15.20 check .
      - name: Byte-compile the server
        run: python3 -m py_compile server.py
      - name: Lint the recipes
        run: uv run --script lint_recipes.py
      - name: An AGENTS.d rule is one line of 255 characters
        run: python3 .github/scripts/check_agents_rule_length.py
      - name: Explanation in code is capped at one line
        run: python3 .github/scripts/check_one_line_comments.py
      - name: Self-check the comment guard
        run: uv run --with pytest python -m pytest .github/scripts/test_check_one_line_comments.py -q

  # Test: pytest on Linux and macOS via an in-memory FastMCP client, read-only / dry_run paths only.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run the test suite
        run: uv run --with pytest --with fastmcp --with pyyaml --with packaging pytest tests/ -v

  # Floor: prove the server imports and registers its tools on the requires-python floor (3.10).
  python-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Import + tool registration under Python 3.10
        run: >
          uv run --python 3.10 --with pytest --with fastmcp --with pyyaml --with packaging
          python -m pytest tests/test_import.py tests/test_tools.py -q

  # Release verification: recipes lint clean, server.json valid, tag matches manifest version.
  release-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags for the version<->tag check
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: server.json is valid
        run: |
          python3 - <<'PY'
          import json, re, sys
          d = json.load(open("server.json"))
          errs = []
          for k in ("name", "description", "version"):
              if k not in d:
                  errs.append(f"missing required field: {k}")
          name = d.get("name", "")
          if not re.match(r"^[a-zA-Z0-9.-]+/[a-zA-Z0-9._-]+$", name):
              errs.append(f"name does not match registry pattern: {name!r}")
          if len(d.get("description", "")) > 100:
              errs.append("description exceeds 100 chars")
          if d.get("version") in ("latest", None):
              errs.append("version must be a concrete semver, not 'latest'")
          repo = d.get("repository", {})
          if not (repo.get("url") and repo.get("source")):
              errs.append("repository needs both url and source")
          if errs:
              print("server.json invalid:")
              for e in errs:
                  print("  -", e)
              sys.exit(1)
          print("ok: server.json valid; version", d["version"])
          PY
      - name: server.json version matches the release tag (tag builds only)
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ ! -f server.json ]; then
            echo "no server.json to check against tag $REF_NAME" >&2
            exit 1
          fi
          ver="$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')"
          echo "manifest version: $ver ; tag: $REF_NAME"
          if [ "$ver" != "${REF_NAME#v}" ]; then
            echo "server.json version ($ver) does not match the release tag ($REF_NAME)" >&2
            exit 1
          fi
          echo "ok: manifest version matches the release tag"
